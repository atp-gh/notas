[package]
name = "notas"
version = "0.1.0"
edition = "2024"
# Floor set by relm4 (1.93); edition 2024 alone would allow 1.85.
rust-version = "1.93"
description = "Notas — a fast local-first note-taking app"

[features]
default = ["gui"]
# GTK4/libadwaita frontend. The data core, application layer and sync
# infrastructure compile and test without it (`--no-default-features`).
gui = [
    "dep:relm4",
    "dep:gtk",
    "dep:libadwaita",
    "dep:sourceview5",
    "dep:glib",
    "dep:pango",
    "dep:tracing-subscriber",
]

[dependencies]
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.9"
subtle = "2"
s3 = "0.1"
reqwest_dav = { version = "0.3", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
relm4 = { version = "0.11", features = ["libadwaita"], optional = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"], optional = true }
libadwaita = { version = "0.9", features = ["v1_9"], optional = true }
sourceview5 = { version = "0.11", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
mermaid-svg = "0.7"
# Only the prebuilt dumps are ever used (`SyntaxSet::load_defaults_newlines`
# + `ThemeSet::load_defaults` in markdown.rs); YAML/plist source loading and
# HTML rendering are dead weight (default-fancy would pull yaml-rust + plist).
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "dump-load", "regex-fancy"] }
glib = { version = "0.22", optional = true }
pango = { version = "0.22", optional = true }
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# The GUI binary is only buildable with its GTK dependencies present.
[[bin]]
name = "notas"
path = "src/main.rs"
required-features = ["gui"]

# Lints are denied here (not just on the command line with `-D warnings`)
# so IDE builds and partial `cargo check`s are held to the same standard.
[lints.clippy]
all = { level = "deny", priority = 10 }
suspicious = { level = "deny", priority = 9 }
style = { level = "deny", priority = 9 }
complexity = { level = "deny", priority = 9 }
perf = { level = "deny", priority = 9 }
redundant_clone = { level = "deny", priority = 9 }

[lints.rust]
unsafe_code = { level = "deny", priority = 10 }
missing_debug_implementations = { level = "deny", priority = 9 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0
incremental = false
overflow-checks = false

# IO-bound / non-hot dependencies: optimize for size, no measurable
# runtime cost (network, logging, markdown parsing tables).
[profile.release.package."s3"]
opt-level = "z"
[profile.release.package."reqx"]
opt-level = "z"
[profile.release.package."reqwest"]
opt-level = "z"
[profile.release.package."reqwest_dav"]
opt-level = "z"
[profile.release.package."tracing-subscriber"]
opt-level = "z"
[profile.release.package."mermaid-svg"]
opt-level = "z"
[profile.release.package."pulldown-cmark"]
opt-level = "z"
[profile.release.package."unicode-width"]
opt-level = "z"
