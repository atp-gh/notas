[package]
name = "notas-core"
version.workspace = true
edition.workspace = true
description = "Core data layer for Notas: schema, repository, search (no GTK)"

[dependencies]
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# End-to-end encryption for synced notes: Argon2id key derivation,
# XChaCha20-Poly1305 sealed blobs, constant-time verifier comparison.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
s3 = "0.1"
reqwest_dav = { version = "0.3", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
