[package]
name = "notas"
version.workspace = true
edition.workspace = true
description = "Notas — a fast local-first note-taking app for Linux"

[dependencies]
notas-core = { path = "../notas-core" }
anyhow = "1"
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
sourceview5 = "0.11"
pulldown-cmark = "0.12"
glib = "0.22"
pango = "0.22"
sqlx.workspace = true
tokio.workspace = true
