[package]
name = "notas"
version.workspace = true
edition.workspace = true
description = "Notas — a fast local-first note-taking app for Linux"

[dependencies]
notas-core = { path = "../notas-core" }
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourceview5 = "0.11"
pulldown-cmark = "0.13"
glib = "0.22"
pango = "0.22"
unicode-width = "0.2"
sqlx.workspace = true
tokio.workspace = true
# Lean S3-compatible client (async + rustls by default), used by the sync
# engine. Works with AWS S3, Cloudflare R2, Backblaze B2, MinIO, …
s3 = "0.1"
# WebDAV client over reqwest (async, PROPFIND/list included) for the
# Nextcloud/ownCloud backend. rustls to match the rest of the stack.
reqwest_dav = { version = "0.3", default-features = false, features = ["rustls-tls"] }
# Direct reqwest dependency: the WebDAV backend builds its own agent so it
# can set timeouts and opt into skipping certificate validation.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
# In-process HTTP mock used by the WebDAV executor integration tests.
wiremock = "0.6"

[lints]
workspace = true
